services:
  postgres:
    image: postgres:16-alpine
    container_name: food_app_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:food_app}
      POSTGRES_DB: ${DB_NAME:food_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:food_app_local_db}
    ports:
        - "5434:5432"
    volumes:
      - food_app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:food_app} -d ${DB_NAME:food_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  food_app:
    build: .
    container_name: food_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:food_app}
      DB_USERNAME: ${DB_USERNAME:food_app}
      DB_PASSWORD: ${DB_PASSWORD:food_app_local_db}
      DB_POOL_SIZE: ${DB_POOL_SIZE:5}
      JWT_SECRET: ${JWT_SECRET:local-development-secret-to-change-this-32-bytes-minimum}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:30}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:http://localhost:5173}

volumes:
  food_app_db_data:


