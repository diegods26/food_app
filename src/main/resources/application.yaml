server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: food_app
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
    flyway:
      enabled: true
      locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES}
    allowed-origin: ${FRONTEND_ORIGIN}

springdoc:
  swagger-ui:
    path: /swagger-ui.html


