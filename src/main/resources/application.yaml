server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: food_app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/food_app}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app_local_db}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:15}
    jwt-issuer: ${JWT_ISSUER:food-app}
    jwt-audience: ${JWT_AUDIENCE:food-app-api}
    allowed-origin: ${FRONTEND_ORIGIN}

springdoc:
  swagger-ui:
    path: /swagger-ui.html


